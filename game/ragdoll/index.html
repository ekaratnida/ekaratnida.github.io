<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Three.js Starter – Spinning Cube</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; height: 100%; background: #0f1420; color: #dfe8ff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    #app { position: fixed; inset: 0; }
    .hint { position: fixed; left: 12px; top: 12px; background: rgba(20,26,40,.6); padding: 10px 12px; border-radius: 10px; backdrop-filter: blur(2px); line-height: 1.35; }
    .hint b { color: #fff; }
    a { color: #8ab4ff; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="hint">
    <b>Three.js Starter</b><br/>
    Orbit: <b>Left drag</b> · Pan: <b>Right drag</b> · Zoom: <b>Scroll</b><br/>
    Press <b>R</b> to reset camera.
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    // --- Scene, Camera, Renderer ---
    const container = document.getElementById('app');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#0f1420');

    const camera = new THREE.PerspectiveCamera(60, 2, 0.1, 1000);
    camera.position.set(4, 3, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.shadowMap.enabled = true;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // --- Lights ---
    scene.add(new THREE.AmbientLight(0xffffff, 0.35));
    const dir = new THREE.DirectionalLight(0xffffff, 1.0);
    dir.position.set(5, 8, 3);
    dir.castShadow = true;
    dir.shadow.mapSize.set(1024, 1024);
    scene.add(dir);

    // --- Ground ---
    const groundGeo = new THREE.PlaneGeometry(50, 50);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x1b2538, roughness: 1 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Grid & Axes helpers
    const grid = new THREE.GridHelper(50, 50, 0x335, 0x223);
    grid.position.y = 0.001; // avoid z-fighting
    scene.add(grid);
    const axes = new THREE.AxesHelper(1.5);
    scene.add(axes);

    // --- Spinning Cube ---
    const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
    const cubeMat = new THREE.MeshStandardMaterial({ color: 0x42a5f5, metalness: 0.15, roughness: 0.5 });
    const cube = new THREE.Mesh(cubeGeo, cubeMat);
    cube.position.y = 0.5;
    cube.castShadow = true;
    scene.add(cube);

    // --- Orbit Controls ---
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0.5, 0);

    // Reset camera with R
    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'r') {
        camera.position.set(4, 3, 6);
        controls.target.set(0, 0.5, 0);
        controls.update();
      }
    });

    // --- Resize ---
    function resize() {
      const { clientWidth: w, clientHeight: h } = container;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    // --- Animate ---
    const clock = new THREE.Clock();
    function animate() {
      const t = clock.getElapsedTime();
      cube.rotation.x = t * 0.6;
      cube.rotation.y = t * 0.8;

      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
